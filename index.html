
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشروعي الأول</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f5f9;
      padding: 40px 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #1769aa; }
    button {
      background: #1769aa;
      color: white;
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 17px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>أهلاً بيك! 🚀</h1>
    <p>هذا أول مشروع ليا على GitHub.</p>
    <button onclick="alert('مبروك! الكود يخدم 🎉')">
      اضغط هنا
    </button>
  </div>
</body>
</html>
